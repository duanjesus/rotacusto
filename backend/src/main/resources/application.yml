spring:
  application:
    name: rotacusto-backend
  # Postgres real, embutido e gerenciado pelo próprio processo do back-end (ver
  # RotaCustoApplication.main() — sobe ANTES do Spring, na porta 5433) — Docker não
  # funciona nesta máquina, e isso evita depender de um Postgres instalado à parte.
  # Dados ficam em ~/.rotacusto/pgdata, fora do repo, e sobrevivem a restarts.
  datasource:
    url: jdbc:postgresql://localhost:5433/postgres
    driver-class-name: org.postgresql.Driver
    username: postgres
    password:
    # Pool pequeno e sem conexão ociosa presa: em produção o banco (Neon) suspende
    # após 5 min sem uso e derruba conexões abertas — max-lifetime abaixo disso
    # evita entregar conexão morta. Sem efeito prático no Postgres embutido local.
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      idle-timeout: 120000
      max-lifetime: 240000
  jpa:
    hibernate:
      # NUNCA create-drop aqui — apagaria histórico de viagens/contas a cada
      # restart. create-drop só faz sentido com H2 em memória (testes, ver
      # src/test/resources/application.yml), que já reseta sozinho.
      ddl-auto: update
    open-in-view: false

server:
  # PORT é injetada pela hospedagem (Render); 8080 em dev local.
  port: ${PORT:8080}

# Configurações do RotaCusto
rotacusto:
  # Atrás de um proxy reverso (produção), getRemoteAddr() é o IP do proxy, não do
  # cliente — RATE_LIMIT_CLIENT_IP_HEADER diz de qual header ler o IP real. Vazio
  # (dev local, sem proxy) usa getRemoteAddr(). Só definir um header que o proxy
  # da hospedagem sobrescreve — um header que o cliente controla anularia o limite.
  rate-limit:
    client-ip-header: ${RATE_LIMIT_CLIENT_IP_HEADER:}
  # CORS (Fase 17) — "*" liberado por padrão pro dev local. Definir
  # CORS_ALLOWED_ORIGINS (separado por vírgula) antes de qualquer deploy real,
  # apontando só pro domínio de produção do app.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  # Nominatim (geocoding do endereço final) + Photon (autocomplete, aceita
  # busca por prefixo — o Nominatim não aceita). Ambos sobre dados OSM.
  geocoding:
    base-url: https://nominatim.openstreetmap.org
    user-agent: "RotaCusto/0.1 (contato: duanjesus30@gmail.com)"
    photon-base-url: https://photon.komoot.io
  # OpenRouteService (roteamento). A chave gratuita fica SÓ no back-end.
  # Defina via variável de ambiente ORS_API_KEY (não versionar a chave).
  routing:
    base-url: https://api.openrouteservice.org
    api-key: ${ORS_API_KEY:}
  # Parâmetros default do cálculo de parada para lanche (usados na Fase 4).
  food-stop:
    interval-hours: 3.0
    average-cost: 25.0
  # Overpass API (OpenStreetMap ao vivo) — usado tanto para pedágios quanto
  # para postos de combustível.
  overpass:
    base-url: https://overpass-api.de/api/interpreter
  # Detecção de pedágios na rota. Combina o dataset curado (poucas praças,
  # coordenadas aproximadas de município — ver TollPlazaSeeder) com busca ao
  # vivo no OpenStreetMap via Overpass (cobertura nacional, coordenadas
  # precisas, mas sem tarifa real — por isso a tarifa-padrão abaixo).
  # osm-detection-radius-km é apertado de propósito: muitas praças no Brasil
  # cobram só um sentido (a cabine física só existe numa das pistas de uma
  # rodovia dividida). Um raio largo "atravessa" o canteiro central e conta o
  # pedágio da pista oposta também — ver TollService.
  tolls:
    curated-detection-radius-km: 5.0
    osm-detection-radius-km: 0.1
    default-tarifa-por-eixo: 5.50
    default-tarifa-moto: 4.00
  # Postos de combustível reais na rota (OpenStreetMap). O preço usado no
  # cálculo continua sendo a média que o usuário informa — não existe fonte
  # gratuita de preço por posto em tempo real no Brasil.
  fuel-stations:
    detection-radius-km: 0.3
    # Fase 15 — sugestão de posto com melhor preço: só os K postos mais
    # próximos do meio geométrico da rota são reverse-geocodificados (custo de
    # rede sequencial, ver reverse-geocode-delay-ms), não todos os candidatos.
    melhor-preco-candidatos-k: 5
    # Etiqueta do Nominatim público (~1 req/s) — 1.1s de margem entre
    # chamadas sequenciais de reverse geocoding.
    reverse-geocode-delay-ms: 1100
  # Autenticação (Fase 6.4b) — segredo do JWT via env var, nunca versionado.
  jwt:
    secret: ${JWT_SECRET:}
    expiration-hours: 24
  # Alertas de trânsito reportados por usuários (Fase 6.6) — sem login. Raio
  # bem mais largo que o de pedágio (que é apertado de propósito): um relato
  # de "buraco" tem imprecisão de GPS natural, e "tem buraco nos próximos km"
  # já é útil o bastante, não precisa de precisão de metro.
  road-alerts:
    detection-radius-km: 2.0
    # Confirmação/reputação (Fase 6.8) — quantos votos "já foi resolvido" de
    # dispositivos distintos são necessários pra expirar um alerta na hora. Baixo o
    # bastante pra importar, alto o bastante pra 1 troll sozinho não conseguir.
    negative-votes-to-expire: 2
  # Relatos automáticos de trânsito lento (Fase 6.7) — raio apertado, tipo
  # postos de combustível: é sobre UMA via específica, não uma área ampla
  # como os alertas de trânsito. TTL bem mais curto que road-alerts porque um
  # engarrafamento é sempre uma condição transitória, sem "tipo" com duração
  # física diferente.
  traffic-reports:
    detection-radius-km: 0.3
    ttl-minutes: 15
  # Radares fixos (câmeras de velocidade, Fase 12) — infraestrutura permanente via
  # OpenStreetMap (highway=speed_camera), sem relato/expiração/voto. Raio apertado,
  # mesmo motivo de fuel-stations/traffic-reports: é sobre um ponto específico numa
  # pista, não uma área ampla.
  radars:
    detection-radius-km: 0.3
  # Restaurantes reais nas paradas pra lanche (Fase 13) — raio bem mais largo que
  # posto/pedágio/radar de propósito: esses têm que estar quase em cima da via,
  # restaurante tipicamente fica um pouco fora da rodovia.
  restaurants:
    detection-radius-km: 3.0
    max-por-parada: 8
