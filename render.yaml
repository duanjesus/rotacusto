# Blueprint do Render — descreve o serviço da API. Os valores marcados com
# sync: false são segredos/ajustes preenchidos no painel do Render, nunca aqui.
services:
  - type: web
    name: rotacusto-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    # Só publica um commit depois que o CI do GitHub passou nele.
    autoDeployTrigger: checksPass
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ORS_API_KEY
        sync: false
      # Postgres externo (Neon), conexão direta — formato
      # jdbc:postgresql://<host>/<banco>?sslmode=require
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # Origem da versão web (ex.: https://main.xxxx.amplifyapp.com), sem barra no fim.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Header de onde ler o IP real do cliente pro rate limit — ver CLAUDE.md,
      # seção "Deploy (Fase 18)".
      - key: RATE_LIMIT_CLIENT_IP_HEADER
        sync: false
