name: Release builds

# Gera os três clientes apontando pra API de produção: APK Android, pasta do
# Windows e site estático da versão web. Os arquivos saem como artifacts do run
# (aba Actions) — publicar/distribuir é um passo manual separado.
#
# Dispare manualmente (Actions > Release builds > Run workflow) informando a URL
# da API. O gatilho de pull_request só existe pra validar mudanças neste próprio
# arquivo; nesse caso a URL é um placeholder e os artifacts não servem pra uso.

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "URL da API de produção, terminando em /api (ex.: https://rotacusto-api.onrender.com/api)"
        required: true
        type: string
  pull_request:
    paths:
      - ".github/workflows/release.yml"

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.6"
  API_BASE_URL: ${{ inputs.api_base_url || 'https://example.invalid/api' }}

jobs:
  android:
    name: Android – APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      # Sem os secrets de assinatura o Gradle cai na chave de debug (ver
      # android/app/build.gradle.kts) — o APK compila, mas não é distribuível.
      - name: Configurar assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Secrets de assinatura ausentes — APK assinado com a chave de debug, não distribuir."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build APK
        run: flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Publicar artifact
        uses: actions/upload-artifact@v4
        with:
          name: rotacusto-android
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows:
    name: Windows – executável
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
        shell: bash

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release --dart-define=API_BASE_URL="$API_BASE_URL"

      # A pasta Release inteira é o app (o .exe depende das DLLs e de data/ ao lado).
      - name: Publicar artifact
        uses: actions/upload-artifact@v4
        with:
          name: rotacusto-windows
          path: app/build/windows/x64/runner/Release
          if-no-files-found: error

  web:
    name: Web – site estático
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Build web
        run: flutter build web --release --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Publicar artifact
        uses: actions/upload-artifact@v4
        with:
          name: rotacusto-web
          path: app/build/web
          if-no-files-found: error
